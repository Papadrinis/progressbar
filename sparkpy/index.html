<title>SparkPy Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@700&display=swap">
<style>
:root {
  --bg: #f3f4ee;
  --surface: #ffffff;
  --surface-2: #eaece3;
  --ink: #171a14;
  --muted: #62675b;
  --line: #dcdfd3;
  --brand: #3db55c;
  --brand-ink: #0d7c39;
  --lime: #9fe870;
  --on-lime: #10240f;
  --sel-bg: #e6f6dc;
  --warn: #b86a12;
  --warn-bg: #fbeedb;
  --bad: #c23b3b;
  --shadow: 0 1px 2px rgba(23,26,20,.06), 0 6px 20px rgba(23,26,20,.06);
  --display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #11130f; --surface: #1a1d17; --surface-2: #232720; --ink: #eef0e8; --muted: #9ba192;
    --line: #2e3329; --brand: #4cc36a; --brand-ink: #7fdc97; --lime: #9fe870; --on-lime: #10240f;
    --sel-bg: #22331b; --warn: #e8a24f; --warn-bg: #33270f; --bad: #ef7070;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11130f; --surface: #1a1d17; --surface-2: #232720; --ink: #eef0e8; --muted: #9ba192;
  --line: #2e3329; --brand: #4cc36a; --brand-ink: #7fdc97; --lime: #9fe870; --on-lime: #10240f;
  --sel-bg: #22331b; --warn: #e8a24f; --warn-bg: #33270f; --bad: #ef7070;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 64px; }
.wrap { max-width: 1240px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 12px 16px; }
.top .wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.brand h1 span { color: var(--brand); }
.brand small { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.count { font-family: var(--mono); font-size: 11px; background: var(--line); color: var(--ink); border-radius: 999px; padding: 1px 7px; }

.banner { margin: 16px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--warn-bg); color: var(--ink); border: 1px solid var(--warn); }

/* crear */
.create { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; margin-top: 24px; align-items: start; }
@media (max-width: 960px) { .create { grid-template-columns: 1fr; } .aside { position: static !important; } }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin-bottom: 20px; }
.step-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.step-head .n { font-family: var(--mono); font-size: 12px; color: var(--brand-ink); font-weight: 600; letter-spacing: .06em; }
.step-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.step-head p { margin: 0; color: var(--muted); font-size: 14px; flex-basis: 100%; }
.field { padding: 14px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 130px minmax(0,1fr); gap: 14px; }
.field:first-of-type { border-top: 0; padding-top: 0; }
@media (max-width: 640px) { .field { grid-template-columns: 1fr; gap: 8px; } }
.field > label, .field > .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; transition: border-color .12s, background .12s; }
.chip:hover { border-color: var(--brand); }
.chip[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--on-lime); font-weight: 600; }
.chip .tag { font-size: 11px; color: var(--muted); }
.chip[aria-pressed="true"] .tag { color: var(--on-lime); opacity: .7; }
.chip.sug::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.chip[aria-pressed="true"].sug::after { background: var(--on-lime); }
.chip.dim { opacity: .55; }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
.hint b { color: var(--ink); font-weight: 600; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.pcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.pcard:hover { border-color: var(--brand); }
.pcard[aria-pressed="true"] { border-color: var(--brand); background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--brand); }
.pcard strong { font-size: 15px; }
.pcard .sub { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); width: fit-content; }
.pill.vida { background: #e0f3e6; color: #0d7c39; }
.pill.escala { background: #e3ebfb; color: #2a4f9e; }
.pill.ok { background: #e0f3e6; color: #0d7c39; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.off { background: var(--surface-2); color: var(--muted); }
:root[data-theme="dark"] .pill.vida, :root[data-theme="dark"] .pill.ok { background: #1f3a26; color: #8fe0a6; }
:root[data-theme="dark"] .pill.escala { background: #1e2a44; color: #9dbbf5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pill.vida, :root:not([data-theme="light"]) .pill.ok { background: #1f3a26; color: #8fe0a6; }
  :root:not([data-theme="light"]) .pill.escala { background: #1e2a44; color: #9dbbf5; }
}

.avatars { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.av { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; display: flex; flex-direction: column; }
.av:hover { border-color: var(--brand); }
.av[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
.av .ph { aspect-ratio: 3 / 4; max-width: 100%; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-family: var(--display); font-size: 30px; font-weight: 800; }
.av img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
.av div.t { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; }
.av strong { font-size: 13.5px; line-height: 1.25; }

.aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-direction: column; gap: 14px; }
.recipe { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 20px; }
.recipe h3 { font-size: 18px; margin-bottom: 12px; }
.recipe dl { margin: 0; display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 13.5px; }
.recipe dt { color: color-mix(in srgb, var(--bg) 60%, transparent); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 1px; }
.recipe dd { margin: 0; font-weight: 600; }
.recipe dd.none { font-weight: 400; color: color-mix(in srgb, var(--bg) 45%, transparent); }
.flags { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.flags div { padding: 7px 10px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 25%, transparent); }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; cursor: pointer; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.block { width: 100%; margin-top: 16px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.lime { background: var(--lime); color: var(--on-lime); }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.recipe .btn.ghost { color: var(--bg); border-color: color-mix(in srgb, var(--bg) 30%, transparent); }

/* guiones */
.options { display: grid; gap: 16px; }
.opt { border: 1px solid var(--line); border-radius: 16px; padding: 18px; background: var(--surface); }
.opt[aria-current="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.opt-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.opt h3 { font-size: 19px; }
.opt .idea { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
.tl { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 14px 0 6px; gap: 2px; }
.tl div { background: var(--surface-2); font-size: 11px; font-weight: 700; display: flex; align-items: center; padding: 0 6px; white-space: nowrap; overflow: hidden; min-width: 0; color: var(--muted); }
.tl div:nth-child(1) { background: var(--lime); color: var(--on-lime); }
.tl div.cta { background: var(--brand); color: #fff; }
.board-wrap { overflow-x: auto; }
table.board { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
.board th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.board td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.board tr:last-child td { border-bottom: 0; }
.board .tc { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.board .paso { font-weight: 700; font-size: 12.5px; }
.board .voz { font-style: italic; }
.board .pant { font-weight: 600; }
.board .pant .k { background: var(--brand); color: #fff; border-radius: 4px; padding: 0 4px; }
.board textarea { width: 100%; min-height: 58px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; font-size: 13.5px; resize: vertical; }
.claims { margin-top: 12px; font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--ink); }
.thinking { display: flex; align-items: center; gap: 12px; padding: 18px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.5); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
pre.raw { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 12px; border-radius: 10px; max-height: 240px; overflow: auto; }

.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.style { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.style:hover { border-color: var(--brand); }
.style[aria-pressed="true"] { border-color: var(--brand); background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--brand); }
.style strong { font-size: 15px; }
.style p { margin: 0; font-size: 13px; color: var(--muted); }
.style .meta { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 6px; }
.style .cost { font-family: var(--mono); font-size: 12px; }

.done { border: 1px solid var(--brand); background: var(--sel-bg); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.cmd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cmd code { font-family: var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; user-select: all; }

/* librería */
.lib { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; margin-top: 24px; align-items: start; }
@media (max-width: 800px) { .lib { grid-template-columns: 1fr; } }
.libnav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
@media (max-width: 800px) { .libnav { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; } }
.libnav button { border: 0; background: transparent; text-align: left; padding: 9px 12px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; color: var(--muted); }
.libnav button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.libtools { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.libtools h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-right: auto; }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; min-width: 0; width: 220px; max-width: 100%; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.item { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.item:hover { border-color: var(--brand); }
.item .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.item strong { font-size: 15.5px; }
.item p { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.item img { width: 56px; height: 72px; object-fit: cover; border-radius: 8px; flex: none; }
.item .with-img { display: flex; gap: 12px; }
.steps-inline { display: flex; flex-wrap: wrap; gap: 4px; }
.steps-inline span { font-size: 11.5px; background: var(--surface-2); border-radius: 6px; padding: 1px 6px; }

/* editor */
.editor { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; background: rgba(10, 12, 8, .35); }
.panel { width: min(560px, 100%); height: 100%; background: var(--surface); padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: -10px 0 40px rgba(0,0,0,.2); }
.panel-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.panel-head h3 { font-size: 22px; }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.fgroup > label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.fgroup input[type=text], .fgroup select, .fgroup textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; width: 100%; }
.fgroup textarea { min-height: 76px; resize: vertical; }
.panel-foot { display: flex; gap: 10px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.imgbox { display: flex; gap: 12px; align-items: center; }
.imgbox img, .imgbox .ph { width: 90px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; background: var(--surface-2); }

/* pedidos */
.orders { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
.order { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; }
.order summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; }
.order summary::-webkit-details-marker { display: none; }
.order summary strong { font-size: 16px; }
.order .meta { font-size: 13px; color: var(--muted); }
.order .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.order select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.lbl { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.add { border: 0; background: transparent; color: var(--brand-ink); font-weight: 700; font-size: 12.5px; padding: 0; cursor: pointer; text-transform: none; letter-spacing: 0; }
.add:hover { text-decoration: underline; }
.field-note { margin: -6px 0 10px 144px; }
@media (max-width: 640px) { .field-note { margin-left: 0; } }
.ai { border: 1px solid var(--brand); background: var(--sel-bg); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.ai > label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--brand-ink); }
.ai textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; width: 100%; min-height: 56px; resize: vertical; }
.ai-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.upl { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.imgbox video { width: 120px; border-radius: 10px; }
.panel.wide { width: min(920px, 100%); }
.onepager .op-title { font-size: 30px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); margin: 6px 0 18px; }
.op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 720px) { .op-grid { grid-template-columns: 1fr; } }
.op-col { display: flex; flex-direction: column; gap: 18px; }
.onepager h4, .deepdive h4 { font-family: var(--body); font-size: 15px; font-weight: 700; margin: 0 0 4px; }
.onepager p, .onepager ul { margin: 0; }
.onepager ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.onepager ul.hooks { list-style: none; padding: 0; gap: 8px; }
.op-media img, .op-media video { width: 100%; max-height: 420px; object-fit: cover; border-radius: 12px; margin-bottom: 8px; }
.op-meta { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 13px; margin: 0; padding-top: 12px; border-top: 1px solid var(--line); }
.op-meta dt { color: var(--muted); }
.op-meta dd { margin: 0; }
.deepdive { border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.deepdive h2 { font-family: var(--body); font-size: 20px; font-weight: 700; }
.deepdive p { margin: 0; line-height: 1.7; }
.dd-tag { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--brand-ink); }
.dd-sum { font-size: 16px; }
.dd-line { color: var(--muted); }
.deepdive blockquote { margin: 6px 0; padding-left: 24px; font-style: italic; font-size: 16px; }
.dd-avs { display: flex; gap: 10px; flex-wrap: wrap; }
.dd-avs div { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; width: 84px; }
.dd-avs img, .dd-avs .ph { width: 84px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
.opt-meta { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; margin: 6px 0 4px; }
.opt-meta > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

      };
      errorGen = e?.code in m ? m[e.code] : 'Algo falló al generar. Vuelva a intentarlo.';

  function dibujarPieza(est, g, mercado, formato, fotos, logo) {
    const [W, H] = TAM[formato] || TAM['4:5'];
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    // En horizontal (1.91:1) el contenido va en una columna centrada, para que la letra no quede diminuta.
    const horizontal = W > H, s = (horizontal ? H * 1.15 : W) / 1080, pad = 72 * s;
    const ctx = cv.getContext('2d'), x0 = horizontal ? (W - H * 1.15) / 2 : 0;
    const rec = RECETAS[est?.id] || RECETAS['titular-impacto'];
    const oferta = ofertaDe(mercado);
    const fondo = rec.fondo;
    const oscuro = fondo === 'tinta' || fondo === 'verde' || fondo === 'foto';
    if (fondo === 'foto') { if (fotos?.[0]) cubrir(ctx, fotos[0], 0, 0, W, H); else fotoFalsa(ctx, 0, 0, W, H, s); degradado(ctx, W, H, rec.grad, rec.fuerza); if (rec.grad === 'arriba') degradado(ctx, W, H, 'abajo', 0.55); }
    else { ctx.fillStyle = { papel: K.papel, tinta: K.tinta, verde: K.verde }[fondo]; ctx.fillRect(0, 0, W, H); }
    if (horizontal && fondo !== 'foto') { dibujarLogo(ctx, logo, pad, pad, 56 * s, oscuro); }
    ctx.save(); ctx.translate(x0, 0);
    const ancho = (horizontal ? H * 1.15 : W) - pad * 2, util = H - pad * 2;
    let y = pad;
    for (const blq of rec.b) {
      const [tipo] = blq;
      const conZona = typeof blq[1] === 'string';
      const z = conZona ? blq[1] : null, frac = conZona ? blq[2] : blq[1], o = (conZona ? blq[3] : blq[2]) || {};
      const h = frac * util, gap = 14 * s, bh = h - gap;
      if (tipo === 'logo') { if (!horizontal || fondo === 'foto') dibujarLogo(ctx, logo, pad, y, Math.min(Math.max(bh * 0.8, 40 * s), 56 * s), oscuro); }
      else if (tipo === 't') texto(ctx, zonaTxt(g, z), pad, y, ancho, bh, { ...o, size: (o.size || 80) * s, min: 14 });
      else if (tipo === 'cta') barraCta(ctx, pad, y, ancho, bh, s, zonaTxt(g, 'cta') || oferta.cta, o.sinPrecio ? null : oferta.precio, o.tema || (oscuro ? 'oscuro' : 'claro'));
      else if (tipo === 'grilla') {
        const items = zonaLista(g, z).slice(0, 9), n = items.length || 1, cols = horizontal ? Math.min(n, 3) : n <= 4 ? 2 : 3, filas = Math.ceil(n / cols);
        const cw = (ancho - (cols - 1) * 18 * s) / cols, ch = (bh - (filas - 1) * 18 * s) / filas;
        items.forEach((it, i) => {
          const cx = pad + (i % cols) * (cw + 18 * s), cy = y + Math.floor(i / cols) * (ch + 18 * s);
          rrect(ctx, cx, cy, cw, ch, 22 * s, K.blanco, '#DCDFD3');
          texto(ctx, icono(it), cx, cy + ch * 0.1, cw, ch * 0.4, { size: Math.min(ch * 0.32, 90 * s), peso: 400, fam: F_TXT, align: 'center', valign: 'middle' });
          texto(ctx, it, cx + 12 * s, cy + ch * 0.52, cw - 24 * s, ch * 0.4, { size: 34 * s, peso: 700, fam: F_TXT, align: 'center', valign: 'middle', min: 12 });
        });
      } else if (tipo === 'columnas') {
        const a = zonaLista(g, 'antes'), d = zonaLista(g, 'despues'), n = Math.max(a.length, d.length, 1), cw = (ancho - 20 * s) / 2, rh = (bh - 70 * s) / n;
        rrect(ctx, pad, y, cw, bh, 22 * s, '#E7E3DA'); rrect(ctx, pad + cw + 20 * s, y, cw, bh, 22 * s, '#E3F5DC', K.verde);
        texto(ctx, 'Cuaderno / Excel', pad, y + 14 * s, cw, 46 * s, { size: 36 * s, peso: 800, color: K.gris, align: 'center' });
        texto(ctx, 'PlanPy', pad + cw + 20 * s, y + 14 * s, cw, 46 * s, { size: 40 * s, peso: 800, color: K.verdeOsc, align: 'center' });
        for (let i = 0; i < n; i++) {
          const ry = y + 70 * s + i * rh;
          if (a[i]) texto(ctx, '✗  ' + a[i], pad + 18 * s, ry, cw - 36 * s, rh - 8 * s, { size: 34 * s, peso: 500, fam: F_TXT, color: K.gris, valign: 'middle', min: 12 });
          if (d[i]) texto(ctx, '✓  ' + d[i], pad + cw + 38 * s, ry, cw - 36 * s, rh - 8 * s, { size: 34 * s, peso: 700, fam: F_TXT, color: K.tinta, valign: 'middle', min: 12 });
        }
      } else if (tipo === 'duelo') {
        const cw = (ancho - 20 * s) / 2;
        rrect(ctx, pad, y, cw, bh, 26 * s, '#E7E3DA'); rrect(ctx, pad + cw + 20 * s, y, cw, bh, 26 * s, K.verde);
        texto(ctx, 'La forma de siempre', pad, y + 20 * s, cw, 44 * s, { size: 32 * s, peso: 700, fam: F_TXT, color: K.gris, align: 'center' });
        texto(ctx, 'Con PlanPy', pad + cw + 20 * s, y + 20 * s, cw, 44 * s, { size: 32 * s, peso: 700, fam: F_TXT, color: K.blanco, align: 'center' });
        texto(ctx, zonaTxt(g, 'antes'), pad + 24 * s, y + 80 * s, cw - 48 * s, bh - 110 * s, { size: 70 * s, color: K.gris, align: 'center', valign: 'middle' });
        texto(ctx, zonaTxt(g, 'con_planpy'), pad + cw + 44 * s, y + 80 * s, cw - 48 * s, bh - 110 * s, { size: 70 * s, color: K.blanco, align: 'center', valign: 'middle' });
      } else if (tipo === 'split') {
        const vert = !horizontal, gapS = 16 * s, pw = vert ? ancho : (ancho - gapS) / 2, ph = vert ? (bh - gapS) / 2 : bh;
        [['antes', 0], ['despues', 1]].forEach(([zz, i]) => {
          const px = vert ? pad : pad + i * (pw + gapS), py = vert ? y + i * (ph + gapS) : y;
          ctx.save(); ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 22 * s); ctx.clip();
          if (fotos?.[i]) cubrir(ctx, fotos[i], px, py, pw, ph); else fotoFalsa(ctx, px, py, pw, ph, s, i ? 'Foto IA · después' : 'Foto IA · antes');
          ctx.restore();
          const lh = 64 * s; rrect(ctx, px + 16 * s, py + ph - lh - 16 * s, pw - 32 * s, lh, lh / 2, i ? K.verde : 'rgba(20,20,20,.82)');
          texto(ctx, zonaTxt(g, zz), px + 34 * s, py + ph - lh - 16 * s, pw - 68 * s, lh, { size: 32 * s, peso: 700, fam: F_TXT, color: K.blanco, align: 'center', valign: 'middle', min: 12 });
        });
        texto(ctx, '→', pad, y, ancho, bh, { size: 90 * s, color: K.tinta, align: 'center', valign: 'middle' });
      } else if (tipo === 'fotoTexto') {
        ctx.save(); ctx.beginPath(); ctx.roundRect(pad, y, ancho, bh, 26 * s); ctx.clip();
        if (fotos?.[0]) cubrir(ctx, fotos[0], pad, y, ancho, bh); else fotoFalsa(ctx, pad, y, ancho, bh, s);
        const gr = ctx.createLinearGradient(0, y + bh, 0, y + bh * 0.35); gr.addColorStop(0, 'rgba(10,12,8,.85)'); gr.addColorStop(1, 'rgba(10,12,8,0)'); ctx.fillStyle = gr; ctx.fillRect(pad, y, ancho, bh);
        ctx.restore();
        texto(ctx, zonaTxt(g, z), pad + 30 * s, y + bh * 0.45, ancho - 60 * s, bh * 0.5, { size: 64 * s, color: K.blanco, valign: 'bottom', min: 14 });
      } else if (tipo === 'ventana') ventana(ctx, pad, y, ancho, bh, s, 'PlanPy', zonaLista(g, z).slice(0, 5));
      else if (tipo === 'burbuja') {
        rrect(ctx, pad, y, ancho, bh, 36 * s, K.blanco);
        texto(ctx, zonaTxt(g, z), pad + 40 * s, y + 30 * s, ancho - 80 * s, bh - 60 * s, { size: 74 * s, valign: 'middle', min: 14 });
      } else if (tipo === 'pasos') {
        const ps = zonaLista(g, z).slice(0, 4), n = ps.length || 1, ph = bh / n;
        ps.forEach((p, i) => {
          const cy = y + i * ph, r = Math.min(ph * 0.32, 46 * s);
          ctx.fillStyle = K.verde; ctx.beginPath(); ctx.arc(pad + r, cy + ph / 2 - 6 * s, r, 0, 7); ctx.fill();
          texto(ctx, String(i + 1), pad, cy + ph / 2 - 6 * s - r, r * 2, r * 2, { size: r * 1.1, color: K.blanco, align: 'center', valign: 'middle' });
          if (i < n - 1) { ctx.fillStyle = '#C9CCC0'; ctx.fillRect(pad + r - 3 * s, cy + ph / 2 + r, 6 * s, ph - r * 2 - 12 * s); }
          texto(ctx, p, pad + r * 2 + 28 * s, cy, ancho - r * 2 - 28 * s, ph - 12 * s, { size: 46 * s, peso: 700, fam: F_TXT, valign: 'middle', min: 12 });
        });
      } else if (tipo === 'lista') {
        const it = zonaLista(g, z).slice(0, 5), n = it.length || 1, rh = bh / n;
        it.forEach((t, i) => {
          rrect(ctx, pad, y + i * rh, ancho, rh - 14 * s, 20 * s, K.blanco, '#DCDFD3');
          texto(ctx, `${i + 1}`, pad + 20 * s, y + i * rh, 70 * s, rh - 14 * s, { size: 60 * s, color: K.verde, align: 'center', valign: 'middle' });
          texto(ctx, t, pad + 110 * s, y + i * rh, ancho - 140 * s, rh - 14 * s, { size: 42 * s, peso: 700, fam: F_TXT, valign: 'middle', min: 12 });
        });
      } else if (tipo === 'postit') {
        const lado = Math.min(ancho * 0.86, bh), px = (W - lado) / 2;
        ctx.save(); ctx.translate(px + lado / 2, y + lado / 2); ctx.rotate(-0.04);
        ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 30 * s; ctx.shadowOffsetY = 12 * s;
        ctx.fillStyle = K.postit; ctx.fillRect(-lado / 2, -lado / 2, lado, lado); ctx.shadowColor = 'transparent';
        texto(ctx, zonaTxt(g, z), -lado / 2 + 50 * s, -lado / 2 + 50 * s, lado - 100 * s, lado - 100 * s, { size: 92 * s, peso: 700, fam: F_MANO, color: '#2b2824', valign: 'middle', lh: 1.15, min: 18 });
        ctx.restore();
      } else if (tipo === 'resena') {
        rrect(ctx, pad, y, ancho, bh, 30 * s, K.blanco);
        texto(ctx, '★★★★★', pad + 40 * s, y + 36 * s, ancho - 80 * s, 60 * s, { size: 54 * s, peso: 400, fam: F_TXT, color: '#F5B301' });
        texto(ctx, `“${zonaTxt(g, 'resena')}”`, pad + 40 * s, y + 110 * s, ancho - 80 * s, bh - 230 * s, { size: 62 * s, peso: 700, fam: F_TXT, min: 14 });
        texto(ctx, [zonaTxt(g, 'autor'), zonaTxt(g, 'negocio')].filter(Boolean).join(' · '), pad + 40 * s, y + bh - 96 * s, ancho - 80 * s, 56 * s, { size: 36 * s, peso: 600, fam: F_TXT, color: K.gris, valign: 'middle' });
      } else if (tipo === 'testimonios') {
        const it = zonaLista(g, z).slice(0, 3), n = it.length || 1, rh = bh / n;
        it.forEach((t, i) => {
          rrect(ctx, pad, y + i * rh, ancho, rh - 18 * s, 24 * s, K.blanco, '#DCDFD3');
          const [quien, ...cita] = t.split(':');
          texto(ctx, cita.length ? `“${cita.join(':').trim()}”` : `“${t}”`, pad + 34 * s, y + i * rh + 24 * s, ancho - 68 * s, rh - 110 * s, { size: 44 * s, peso: 700, fam: F_TXT, min: 12 });
          if (cita.length) texto(ctx, '★★★★★  ' + quien.trim(), pad + 34 * s, y + (i + 1) * rh - 74 * s, ancho - 68 * s, 40 * s, { size: 30 * s, peso: 600, fam: F_TXT, color: K.gris, valign: 'middle' });
        });
      } else if (tipo === 'post') {
        rrect(ctx, pad, y, ancho, bh, 28 * s, K.blanco, '#DCDFD3');
        const autor = zonaTxt(g, 'autor') || 'Cliente';
        ctx.fillStyle = K.verde; ctx.beginPath(); ctx.arc(pad + 70 * s, y + 70 * s, 36 * s, 0, 7); ctx.fill();
        texto(ctx, autor.slice(0, 1).toUpperCase(), pad + 34 * s, y + 34 * s, 72 * s, 72 * s, { size: 40 * s, color: K.blanco, align: 'center', valign: 'middle' });
        texto(ctx, autor, pad + 124 * s, y + 40 * s, ancho - 170 * s, 60 * s, { size: 38 * s, peso: 700, fam: F_TXT, valign: 'middle' });
        texto(ctx, zonaTxt(g, 'post'), pad + 40 * s, y + 140 * s, ancho - 80 * s, bh - 230 * s, { size: 54 * s, peso: 500, fam: F_TXT, min: 14 });
        texto(ctx, '♡  💬  ↗', pad + 40 * s, y + bh - 80 * s, ancho - 80 * s, 50 * s, { size: 38 * s, peso: 400, fam: F_TXT, color: K.gris, valign: 'middle' });
      }
      y += h;
    }
    ctx.restore();
    return cv;
  }

  // --- conectores ---
  const errMcp = (e, server) => ({
    server_not_connected: `Conecte ${server} en claude.ai → Configuración → Conectores.`,
    needs_reauth: `Vuelva a conectar ${server} en claude.ai → Configuración → Conectores.`,
    not_in_manifest: `Esta página no tiene permiso para usar ${server}. Recárguela y permítalo.`,
    selection_required: `Elija cuál conector de ${server} usar en el aviso de claude.ai.`,
    blocked_by_policy: `Su organización bloquea ${server} en esta página.`,
    server_unavailable: `${server} no responde ahora. Inténtelo en un momento.`,
    tool_error: `${server} respondió con un error: ${e?.message || ''}`,
    not_granted: 'Esta vista no puede usar conectores. Abra la página en claude.ai.',
    capability_disabled: 'Esta vista no puede usar conectores. Abra la página en claude.ai.',
  }[e?.code] || `${server} falló: ${e?.message || e?.code || 'error'}`);
  const llamar = async (server, tool, input) => {
    if (!mcp) throw { code: 'not_granted' };
    const r = await mcp.callTool(server, tool, input, { cache: false });
    return r?.payload ?? r;
  };
  const dormir = (ms) => new Promise((r) => setTimeout(r, ms));

  async function generarFotos(est, g, p, formatos, avance) {
    const av = p.avatar || {};
    const base = [
      'Fotografía documental realista, luz natural, cámara de celular de gama media.',
      g.visual || '',
      av.rasgos ? `Persona: ${av.nombre || ''}, ${av.rasgos}.` : '',
      av.look ? `Vestuario: ${av.look.vestuario || ''}. Escenario: ${av.look.escenario || ''}.` : '',
      'Negocio pequeño de Colombia, humilde pero cuidado: paredes pintadas, ordenado, limpio, nada lujoso.',
      'Sin texto, sin letras, sin logos, sin pantallas legibles (monitor de espaldas o celular sin leerse).',
    ].filter(Boolean).join(' ');
    const aire = /arriba/.test(RECETAS[est.id]?.grad || '') ? 'Deja la parte de arriba despejada (cielo, pared lisa) para poner texto.' : 'Deja una zona despejada para poner texto.';
    const medias = av.casting_job ? [{ value: av.casting_job, role: 'image_references' }] : undefined;
    const reqs = [];
    formatos.forEach((f, fi) => {
      const variantes = est.id === 'antes-despues' ? [`Momento ANTES: ${zonaTxt(g, 'antes')}. Expresión cansada pero digna.`, `Momento DESPUÉS: ${zonaTxt(g, 'despues')}. Misma persona, tranquila.`] : [''];
      variantes.forEach((v, vi) => reqs.push({ index: fi * 10 + vi, params: { model: 'gpt_image_2_5', quality: 'high', resolution: '2k', aspect_ratio: AR_IA[f], prompt: `${base} ${v} ${aire}`.trim(), ...(medias ? { medias } : {}) } }));
    });
    avance(`Pidiendo ${reqs.length} foto(s) a Higgsfield…`);
    const sub = await llamar('Higgsfield', 'generate_image_batch', { requests: reqs });
    const jobs = (sub?.jobs || []).filter((j) => j.job_id).map((j) => ({ index: j.index, job_id: j.job_id }));
    if (jobs.length < reqs.length) throw { code: 'tool_error', message: (sub?.jobs || []).map((j) => j.error).filter(Boolean).join('; ') || 'no se pudieron enviar todas las fotos' };
    let res = null;
    for (let i = 0; i < 40; i++) {
      res = await llamar('Higgsfield', 'jobs_wait', { jobs, timeout_seconds: 15 });
      const hechos = (res?.jobs || []).filter((j) => j.status === 'completed').length;
      avance(`Generando fotos… ${hechos} de ${jobs.length}`);
      if (res?.all_terminal) break;
      await dormir(Math.min(15000, (res?.poll_after_seconds || 3) * 1000));
    }
    const fallidas = (res?.jobs || []).filter((j) => j.status !== 'completed');
    if (!res?.all_terminal || fallidas.length) throw { code: 'tool_error', message: `${fallidas.length || 'algunas'} foto(s) no se generaron` };
    avance('Descargando las fotos…');
    const porIndice = {}, blobs = {};
    for (const j of res.jobs) {
      try { blobs[j.index] = await (await fetch(j.result_url)).blob(); porIndice[j.index] = await createImageBitmap(blobs[j.index]); }
      catch { throw { code: 'descarga', message: 'El navegador no dejó descargar la foto generada.' }; }
    }
    const porFormato = (m) => formatos.map((f, fi) => [m[fi * 10], m[fi * 10 + 1]].filter(Boolean));
    return { fotos: porFormato(porIndice), blobs: porFormato(blobs), jobs: res.jobs.map((j) => j.job_id), creditos: reqs.length * COSTO_FOTO };
  }

  const estadoGen = {}; // pedidoId -> texto de avance (solo esta vista)
  async function producirEstatico(p) {
    const est = byId('estructuras', p.estructura?.id) || p.estructura;
    if (!est || !assets) { toast('Falta el template o el permiso para subir archivos.'); return; }
    const formatos = p.formatos?.length ? p.formatos : ['4:5'];
    const g = p.guion || {};
    const ref = db.doc('pedidos/' + p.id);
    const pasos = (estado, nota) => ({ pasos: [{ nombre: 'Fotos (Higgsfield)', estado: necesitaFoto(est) ? estado.f : 'hecho', nota: necesitaFoto(est) ? nota.f || '' : 'No hace falta: template de código.' }, { nombre: 'Composición y texto', estado: estado.c, nota: nota.c || '' }] });
    const avance = (t) => { estadoGen[p.id] = t; render(); };
    try {
      await ref.update({ estado: 'en producción', produccion: { ...(p.produccion || {}), ...pasos({ f: 'en curso', c: 'pendiente' }, {}), creditos: { estimado: costoEstatico(est, formatos), gastado: p.produccion?.creditos?.gastado || 0 } } });
      await cargarRecursos();
      let fotos = formatos.map(() => []), info = { jobs: [], creditos: 0 };
      if (necesitaFoto(est)) { info = await generarFotos(est, g, p, formatos, avance); fotos = info.fotos; }
      avance('Componiendo el texto…');
      const version = Math.max(0, ...(p.produccion?.entregas || []).map((e) => e.version || 1)) + 1;
      const nuevas = [];
      for (const [i, f] of formatos.entries()) {
        const cv = dibujarPieza(est, g, p.mercado, f, fotos[i], logoImg);
        const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
        const up = await assets.upload(new File([blob], `${slug(p.titulo)}-${f.replace(/[:.]/g, '-')}-v${version}.png`, { type: 'image/png' }));
        nuevas.push({ asset: up.id, tipo: 'image', nombre: `${p.titulo || 'Anuncio'} · ${f}`, formato: f, version, fecha: new Date().toISOString() });
      }
      const gastado = (p.produccion?.creditos?.gastado || 0) + info.creditos;
      await ref.update({ estado: 'listo', resultado: { creditos: gastado, fotos: info.jobs }, produccion: { ...pasos({ f: 'hecho', c: 'hecho' }, { f: info.jobs.length ? `${info.jobs.length} foto(s) · ${info.creditos} créditos` : '' }), creditos: { estimado: costoEstatico(est, formatos), gastado }, entregas: [...(p.produccion?.entregas || []), ...nuevas] } });
      delete estadoGen[p.id]; toast('Piezas listas'); abiertos.add(p.id); render();
    } catch (e) {
      const msg = e?.code === 'descarga' || e?.code === undefined ? (e?.message || 'Algo falló al generar.') : errMcp(e, 'Higgsfield');
      estadoGen[p.id] = '⚠ ' + msg; render();
      try { await ref.update({ estado: 'en cola', produccion: { ...(p.produccion || {}), ...pasos({ f: 'esperando aprobación', c: 'pendiente' }, { f: msg }) } }); } catch {}
    }
  }

  // ---------- PEDIDOS ----------
  // La sesión de Claude Code que produce el pedido escribe en `produccion`:
  //   pasos: [{nombre, estado: 'hecho'|'en curso'|'esperando aprobación'|'pendiente', nota}]
  //   revisiones: [{id, titulo, nota, items: [{asset, tipo: 'image'|'video', etiqueta}]}]

  // Brief corto → Claude escribe el copy de varios templates a la vez → la grilla dibuja cada pieza en la página.
  // Editar el texto es instantáneo y gratis; solo «Poner foto» gasta créditos (Higgsfield). Sin pedidos ni colas.
  const ES = Object.assign({ mercado: 'CO', rubro: null, persona: null, angulo: null, avatar: null, modo: 'frio', templates: [], formatos: ['4:5'], cantidad: 6 }, store.get('est', {}));
  let piezas = store.get('estPiezas', []);
  let guardadas = [], genEst = null, errEst = null, vistaEst = 'lote';
  const guardarEst = () => { store.set('est', ES); store.set('estPiezas', piezas.slice(0, 40)); };
  const fotoCache = new Map();
  const bitmapDe = async (id) => {
    if (!fotoCache.has(id)) fotoCache.set(id, fetch(imgSrc(id)).then((r) => r.blob()).then((b) => createImageBitmap(b)).catch(() => null));
    return fotoCache.get(id);
  };
  const uid = () => Math.random().toString(36).slice(2, 10);
  const templatesImagen = () => lib.estructuras.filter((e) => tipoDe(e) === 'imagen').sort((a, b) => tierRank(a) - tierRank(b));
  const usable = (e) => !(pideResenas(e) && !lib.resenas.some((r) => (r.texto || '').trim()));
  // Variedad: rota templates según el objetivo. Frío prioriza S/A; retargeting, los B. Nunca D–F en automático.
  const elegirTemplates = () => {
    if (ES.modo === 'manual') return ES.templates.map((id) => byId('estructuras', id)).filter(Boolean).filter(usable);
    const pool = templatesImagen().filter(usable).filter((e) => !/[DEF]/.test(e.tier || ''));
    const peso = (e) => (ES.modo === 'frio' ? ({ S: 0, A: 0, B: 1, C: 2 }[e.tier] ?? 3) : ({ B: 0, A: 1, S: 1, C: 2 }[e.tier] ?? 3));
    const orden = [...pool].sort((a, b) => peso(a) - peso(b) || Math.random() - 0.5);
    return orden.slice(0, Math.max(1, Math.min(ES.cantidad, orden.length)));
  };
  const avatarEst = () => byId('avatares', ES.avatar) || [...lib.avatares].sort((a, b) =>
    ((b.personas || []).includes(ES.persona) - (a.personas || []).includes(ES.persona)) || ((b.mercado === ES.mercado) - (a.mercado === ES.mercado)) || ((a.orden ?? 999) - (b.orden ?? 999)))[0] || null;

  function promptEstaticos(tpls, unoSolo) {
    const data = {
      mercado: ES.mercado,
      rubro: pickFields(byId('rubros', ES.rubro), ['nombre', 'tipo', 'escenario', 'dolor']),
      buyer_persona: pickFields(byId('personas', ES.persona), ['nombre', 'resumen', 'eje', 'edad', 'negocio', 'identidad', 'tension', 'deseo', 'disparador', 'cita', 'no_decir']),
      angulo: pickFields(byId('angulos', ES.angulo), ['nombre', 'sobre', 'por_que', 'pregunta']),
      avatar: pickFields(avatarEst(), ['nombre', 'edad', 'genero', 'ciudad', 'rasgos']),
      features: lib.features.map((f) => pickFields(f, ['nombre', 'claim', 'estado'])),
      templates: tpls.map((e) => ({ id: e.id, ...pickFields(e, ['nombre', 'descripcion', 'zonas', 'layout', 'nota']) })),
      ...(tpls.some(pideResenas) ? { resenas_reales: lib.resenas.filter((r) => (r.texto || '').trim()).map((r) => pickFields(r, ['texto', 'nombre', 'negocio', 'fuente'])) } : {}),
    };
    return `Eres el copywriter de anuncios estáticos de PlanPy para Meta y TikTok. Escribe ${unoSolo ? 'una versión NUEVA y distinta' : 'una pieza por template'} para ${unoSolo ? 'este template' : 'estos templates'}, todos sobre el mismo brief, cada uno con un gancho distinto.

${REGLAS}

Reglas del estático: se lee en 2 segundos. Titular de máximo 8 palabras; ninguna zona de más de 20 palabras. En pantalla se escribe "PlanPy" y "planpy.io". Zona "cta": máximo 6 palabras con la oferta (el precio lo agrega el sistema). Zona "precio" o cifras: solo las aprobadas. Comparaciones siempre contra la forma de siempre (cuaderno, Excel, WhatsApp, memoria), nunca contra una marca. Nada de testimonios inventados: en templates de reseña o publicación usa SOLO resenas_reales, textuales, con su autor y negocio.

Mercado y oferta: ${OFERTA[ES.mercado]}

${HECHOS}

Brief:
${JSON.stringify(data, null, 1)}

Llena exactamente las zonas de cada template; una zona que sea lista (filas, módulos, pasos, razones, testimonios "Nombre · negocio: cita") va como array de strings. El ángulo es solo el dolor: cada pieza lo muestra con su propia situación (otro lugar, momento o persona), sin repetir la misma escena entre templates. "visual" describe la foto si el template la usa (persona, acción, encuadre; sin texto ni pantallas legibles). "look" es la ropa y el escenario del avatar.
Responde SOLO con JSON: {"piezas":[{"template":"<id>","idea":"una frase","copy":{"<zona>":"texto o array"},"visual":"...","look":{"vestuario":"...","escenario":"..."}}]}`;
  }

  async function generarLote() {
    const tpls = elegirTemplates();
    if (!sample || !tpls.length || !ES.persona || !ES.angulo) return;
    const ctl = new AbortController();
    genEst = ctl; errEst = null; render();
    try {
      const res = await sample.json(promptEstaticos(tpls), { signal: ctl.signal, cache: false, modelTier: 'default' });
      const nuevas = (res?.piezas || []).filter((p) => p && byId('estructuras', p.template) && p.copy).map((p) => ({ uid: uid(), template: p.template, idea: p.idea || '', copy: p.copy, visual: p.visual || '', look: p.look || null, fotos: {} }));
      if (!nuevas.length) throw { code: 'invalid_json' };
      piezas = [...nuevas, ...piezas].slice(0, 40); guardarEst();
    } catch (e) { errEst = e?.code === 'cancelled' ? null : sampleErr(e); }
    finally { genEst = null; render(); }
  }

  async function otraVersion(pz, btn) {
    const e = byId('estructuras', pz.template);
    btn.disabled = true; btn.textContent = 'Escribiendo…';
    try {
      const res = await sample.json(promptEstaticos([e], true) + `\n\nLa versión anterior era: ${JSON.stringify(pz.copy)}. Escribe otra con un gancho diferente.`, { cache: false });
      const n = (res?.piezas || [])[0];
      if (!n?.copy) throw { code: 'invalid_json' };
      Object.assign(pz, { copy: n.copy, idea: n.idea || pz.idea, visual: n.visual || pz.visual, look: n.look || pz.look }); guardarEst(); render();
    } catch (err) { toast(sampleErr(err)); btn.disabled = false; btn.textContent = 'Otra versión'; }
  }

  async function ponerFoto(pz, btn, formatos) {
    const e = byId('estructuras', pz.template), av = avatarEst();
    btn.disabled = true;
    const decir = (t) => { btn.textContent = t; };
    try {
      const pseudo = { avatar: av ? { nombre: av.nombre, rasgos: av.rasgos, casting_job: av.casting_job, look: pz.look } : {}, mercado: ES.mercado };
      const r = await generarFotos(e, { copy: pz.copy, visual: pz.visual }, pseudo, formatos, decir);
      decir('Guardando las fotos…');
      pz.fotos = pz.fotos || {};
      for (const [i, f] of formatos.entries()) {
        const ids = [];
        for (const b of r.blobs[i]) { const up = await assets.upload(new File([b], `foto-${pz.template}-${f.replace(/[:.]/g, '-')}.png`, { type: b.type || 'image/png' })); ids.push(up.id); }
        pz.fotos[f] = ids;
      }
      pz.creditos = (pz.creditos || 0) + r.creditos; guardarEst(); toast('Foto lista'); render();
    } catch (err) {
      toast(err?.code === 'descarga' || !err?.code ? (err?.message || 'No se pudo poner la foto.') : errMcp(err, 'Higgsfield'));
      btn.disabled = false; btn.textContent = 'Poner foto';
    }
  }

  async function descargarPieza(pz, f, mercado) {
    if (!downloads) { toast('Las descargas no están disponibles en esta vista.'); return; }
    await cargarRecursos();
    const e = byId('estructuras', pz.template);
    const fotos = await Promise.all((pz.fotos?.[f] || []).map(bitmapDe));
    const cv = dibujarPieza(e, { copy: pz.copy }, mercado, f, fotos.filter(Boolean), logoImg);
    const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
    try { await downloads.save({ filename: `${slug(e?.nombre || 'estatico')}-${f.replace(/[:.]/g, 'x')}.png`, data: blob }); }
    catch (err) { if (err?.code !== 'declined') toast(err?.code === 'rate_limited' ? 'Ya hay una descarga abierta.' : 'No se pudo descargar.'); }
  }

  // Una tarjeta: las piezas dibujadas en cada formato + edición en el lugar.
  function tarjetaPieza(pz, opts = {}) {
    const e = byId('estructuras', pz.template);
    const mercado = opts.mercado || ES.mercado, formatos = opts.formatos || ES.formatos;
    const lienzos = h('div', { class: 'piezas' });
    const pintar = async () => {
      await cargarRecursos();
      const figs = [];
      for (const f of formatos) {
        const fotos = (await Promise.all((pz.fotos?.[f] || []).map(bitmapDe))).filter(Boolean);
        const cv = dibujarPieza(e, { copy: pz.copy }, mercado, f, fotos, logoImg); cv.className = 'pieza';
        figs.push(h('figure', {}, cv, h('figcaption', {}, f, ' ', h('button', { class: 'add', onclick: () => descargarPieza(pz, f, mercado) }, 'Descargar'))));
      }
      lienzos.replaceChildren(...figs);
    };
    pintar();
    let t;
    const editor = h('div', { class: 'est-edit', hidden: true }, (e?.zonas || Object.keys(pz.copy || {})).map((z) => {
      const v = pz.copy?.[z], lista = Array.isArray(v);
      return h('label', { class: 'fgroup' }, h('span', { class: 'k2' }, z + (lista ? ' (una por línea)' : '')), h('textarea', { oninput: (ev) => {
        pz.copy[z] = lista ? ev.target.value.split('\n').filter((x) => x.trim()) : ev.target.value;
        clearTimeout(t); t = setTimeout(() => { pintar(); if (opts.onEdit) opts.onEdit(); else guardarEst(); }, 250);
      } }, lista ? v.join('\n') : v || ''));
    }));
    const conFoto = necesitaFoto(e), faltaFoto = conFoto && formatos.some((f) => !(pz.fotos?.[f] || []).length);
    const costo = conFoto ? fotosPorFormato(e) * formatos.filter((f) => !(pz.fotos?.[f] || []).length).length * COSTO_FOTO : 0;
    const fotoBtn = conFoto && !opts.guardada ? h('button', { class: 'btn small lime', disabled: !mcp || !assets, title: !mcp ? 'Abra la página en claude.ai con el conector Higgsfield' : null, onclick: () => {
      if (!fotoBtn.dataset.ok) { fotoBtn.dataset.ok = '1'; fotoBtn.textContent = `Confirmar · ~${costo} créditos`; return; }
      ponerFoto(pz, fotoBtn, formatos.filter((f) => !(pz.fotos?.[f] || []).length));
    } }, faltaFoto ? `Poner foto · ~${costo} créditos` : 'Foto lista ✓') : null;
    if (fotoBtn && !faltaFoto) fotoBtn.disabled = true;
    return h('article', { class: 'est-card' },
      h('div', { class: 'ped-row' }, h('div', {}, h('strong', {}, e?.nombre || pz.template), ' ', e?.tier ? h('span', { class: tierClass(e) }, `Tier ${e.tier}`) : null),
        opts.guardada ? h('span', { class: 'mono muted' }, fmtFecha(pz.creado)) : null),
      pz.idea ? h('p', { class: 'muted', style: 'margin:4px 0 0;font-size:13.5px' }, pz.idea) : null,
      lienzos,
      editor,
      h('div', { class: 'cmd' },
        h('button', { class: 'btn small ghost', onclick: (ev) => { editor.hidden = !editor.hidden; ev.target.textContent = editor.hidden ? 'Editar texto' : 'Listo'; } }, 'Editar texto'),
        opts.guardada ? null : h('button', { class: 'btn small ghost', disabled: !sample, onclick: (ev) => otraVersion(pz, ev.target) }, 'Otra versión'),
        fotoBtn,
        opts.guardada
          ? h('button', { class: 'btn small danger', onclick: async (ev) => { if (!ev.target.dataset.ok) { ev.target.dataset.ok = 1; ev.target.textContent = '¿Borrar? Pulse otra vez'; return; } try { await db.doc('estaticos/' + pz.id).delete(); } catch (err) { toast(dbErr(err)); } } }, 'Borrar')
          : h('button', { class: 'btn small', disabled: !db, onclick: async () => {
              try { await db.collection('estaticos').add({ template: pz.template, nombre: e?.nombre || '', idea: pz.idea, copy: pz.copy, visual: pz.visual, look: pz.look, fotos: pz.fotos || {}, mercado: ES.mercado, formatos: ES.formatos, persona: ES.persona, angulo: ES.angulo, creditos: pz.creditos || 0, creado: new Date().toISOString() }); toast('Guardada en «Guardadas»'); }
              catch (err) { toast(dbErr(err)); }
            } }, 'Guardar'),
        opts.guardada ? null : h('button', { class: 'add', onclick: () => { piezas = piezas.filter((x) => x !== pz); guardarEst(); render(); } }, 'Quitar')));
  }

  function renderEst() {
    const root = document.getElementById('view-est');
    root.replaceChildren();
    const byOrden = (c) => [...lib[c]].sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
    const pickE = (k, id) => { ES[k] = ES[k] === id ? null : id; guardarEst(); render(); };
    const persona = byId('personas', ES.persona), sugAng = new Set(persona?.angulos || []);
    const av = avatarEst();
    const tpls = elegirTemplates();
    const listo = ES.persona && ES.angulo && tpls.length && ES.formatos.length;
    const brief = h('div', { class: 'step' },
      h('div', { class: 'step-head' }, h('span', { class: 'n' }, 'ESTÁTICOS'), h('h2', {}, 'Brief'), h('p', {}, 'Elija a quién le habla y con qué ángulo. Claude escribe el copy de varios templates a la vez y la página dibuja cada pieza.')),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Mercado'), h('div', {}, h('div', { class: 'seg' }, ...[['CO', 'Colombia · usted'], ['AR', 'Argentina · vos']].map(([k, l]) => h('button', { 'aria-pressed': String(ES.mercado === k), onclick: () => { ES.mercado = k; guardarEst(); render(); } }, l))))),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Rubro (opcional)'), h('div', { class: 'chips' }, byOrden('rubros').map((r) => chip(r.nombre, ES.rubro === r.id, () => pickE('rubro', r.id))))),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Buyer persona'), h('div', { class: 'chips' }, byOrden('personas').map((p) => chip(p.nombre, ES.persona === p.id, () => pickE('persona', p.id), { tag: p.eje })))),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Ángulo'), h('div', { class: 'chips' }, byOrden('angulos').filter((a) => !/aparcado/i.test(a.estado || '')).map((a) => chip(a.nombre, ES.angulo === a.id, () => pickE('angulo', a.id), { sug: sugAng.has(a.id), title: a.pregunta })))),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Avatar (fotos)'), h('div', {}, h('div', { class: 'chips' }, byOrden('avatares').map((a) => chip(a.nombre, av?.id === a.id, () => { ES.avatar = a.id; guardarEst(); render(); }, { tag: a.casting_job ? 'con cara' : '' }))),
        h('div', { class: 'hint' }, 'Solo se usa en los templates con foto. Si el avatar tiene casting, la foto mantiene su cara.'))),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Templates'), h('div', {},
        h('div', { class: 'seg' }, ...[['frio', 'Variedad · público frío'], ['retarget', 'Variedad · retargeting'], ['manual', 'Elegir yo']].map(([k, l]) => h('button', { 'aria-pressed': String(ES.modo === k), onclick: () => { ES.modo = k; guardarEst(); render(); } }, l))),
        ES.modo === 'manual'
          ? h('div', { class: 'chips', style: 'margin-top:10px' }, templatesImagen().map((e) => chip(e.nombre, ES.templates.includes(e.id), () => { ES.templates = ES.templates.includes(e.id) ? ES.templates.filter((x) => x !== e.id) : [...ES.templates, e.id]; guardarEst(); render(); }, { tag: e.tier, dim: !usable(e), title: usable(e) ? e.mejor_para : 'Necesita reseñas reales en Librería → Reseñas' })))
          : h('div', { class: 'cmd', style: 'margin-top:10px' }, h('span', { class: 'k2' }, 'Cuántas'), h('div', { class: 'seg' }, ...[3, 6, 9].map((n) => h('button', { 'aria-pressed': String(ES.cantidad === n), onclick: () => { ES.cantidad = n; guardarEst(); render(); } }, String(n))))),
        h('div', { class: 'hint' }, tpls.length ? ['Saldrán: ', h('b', {}, tpls.map((e) => e.nombre).join(' · '))] : 'Elija al menos un template.'))),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Formatos'), h('div', { class: 'chips' }, FORMATOS.map(([f, l]) => chip(f, ES.formatos.includes(f), () => { ES.formatos = ES.formatos.includes(f) ? ES.formatos.filter((x) => x !== f) : [...ES.formatos, f]; guardarEst(); render(); }, { tag: l })))),
      h('div', { class: 'cmd', style: 'margin-top:14px' },
        h('button', { class: 'btn lime', disabled: !listo || !sample || !!genEst, onclick: generarLote }, genEst ? 'Escribiendo…' : `Generar ${tpls.length || ''} piezas`),
        genEst ? h('button', { class: 'btn ghost small', onclick: () => genEst?.abort() }, 'Detener') : null,
        !sample ? h('span', { class: 'hint' }, 'Generar el copy necesita abrir la página en claude.ai.') : !listo ? h('span', { class: 'hint' }, 'Falta buyer persona, ángulo o formato.') : h('span', { class: 'hint' }, 'El texto es gratis; solo «Poner foto» gasta créditos.')));
    const tabs = h('div', { class: 'seg', style: 'margin:4px 0 14px' }, ...[['lote', `Generadas (${piezas.length})`], ['guardadas', `Guardadas (${guardadas.length})`]].map(([k, l]) => h('button', { 'aria-pressed': String(vistaEst === k), onclick: () => { vistaEst = k; render(); } }, l)));
    const lista = h('div', { class: 'est-grid' });
    if (vistaEst === 'lote') {
      if (genEst) lista.append(h('div', { class: 'thinking' }, h('span', { class: 'dot' }), h('span', {}, 'Escribiendo el copy de cada template… tarda entre 20 y 60 segundos.')));
      if (errEst) lista.append(h('div', { class: 'claims' }, errEst));
      if (!piezas.length && !genEst) lista.append(h('div', { class: 'empty' }, 'Todavía no hay piezas. Complete el brief y pulse «Generar».'));
      piezas.forEach((pz) => lista.append(tarjetaPieza(pz)));
    } else {
      if (!guardadas.length) lista.append(h('div', { class: 'empty' }, 'Lo que guarde aparece aquí, con su texto y sus fotos, listo para descargar.'));
      guardadas.forEach((pz) => lista.append(tarjetaPieza(pz, { guardada: true, mercado: pz.mercado, formatos: pz.formatos, onEdit: () => db.doc('estaticos/' + pz.id).update({ copy: pz.copy }).catch((err) => toast(dbErr(err))) })));
    }
    root.append(h('div', { class: 'est-wrap' }, brief, h('div', {}, tabs, lista)));
  }

  function render() {
    document.getElementById('ped-count').textContent = cuentaPed();
    if (view === 'crear') renderCrear();
    else if (view === 'lib') renderLib();
    else if (view === 'est') renderEst();
    else renderPed();
  }

  // ---------- arranque ----------
  setView(view);
  (async () => {
    const [d, s, a, dl, m] = await Promise.all([claude.use('db'), claude.use('sample'), claude.use('assets'), claude.use('downloads'), claude.use('mcp')].map((p) => p.catch(() => null)));
    db = d; sample = s; assets = a; downloads = dl; mcp = m;
    if (!db) {
      const b = document.getElementById('banner');
      b.textContent = 'La librería vive en claude.ai: abra esta página allí para ver y editar rubros, personas, ángulos y pedidos.';
      b.hidden = false; loaded = true; render(); return;
    }
    let pending = ORDER.length + 1;
    const doneOne = () => { if (--pending === 0) loaded = true; };
    const onErr = (e) => { if (e?.code !== 'revoked') toast('Se perdió la conexión con la librería. Recargue la página.'); };
    let timer = null;
    const soon = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const a = document.activeElement;
        // No repintar mientras alguien escribe o edita: se reintenta en un momento.
        if (document.querySelector('.editor') || (a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))) { soon(); return; }
        render();
      }, 400);
    };
    for (const col of ORDER) {
      let first = true;
      db.collection(col).onSnapshot((snap) => {
        lib[col] = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
        if (first) { first = false; doneOne(); }
        if (view === 'lib' && col === libCol && document.activeElement?.id === 'lib-search') renderLibItems(); else soon();
      }, onErr);
    }
    db.collection('estaticos').orderBy('creado', 'desc').limit(100).onSnapshot((snap) => {
      guardadas = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
      if (view === 'est') soon();
    }, onErr);
    let firstP = true;
    db.collection('pedidos').orderBy('creado', 'desc').limit(200).onSnapshot((snap) => {
      pedidos = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
      if (firstP) { firstP = false; doneOne(); }
      if (view === 'ped' && document.activeElement?.tagName === 'SELECT') { document.getElementById('ped-count').textContent = cuentaPed(); return; }
      soon();
    }, onErr);
    render();
  })();
})();
</script>
